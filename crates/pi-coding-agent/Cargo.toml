[package]
name = "pi-coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
serde_yaml = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
once_cell = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
zip = { workspace = true }
pi-ai = { workspace = true }
pi-agent-core = { workspace = true }
pi-tui = { workspace = true }
pi-jev = { workspace = true }
mermansi = "=0.1.6"
pulldown-cmark = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes"] }

[[bin]]
name = "optimus-rust"
path = "src/bin/optimus_rust.rs"
