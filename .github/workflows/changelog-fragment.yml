name: Changelog fragment

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  changelog-fragment:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Require a changelog fragment for changed packages or an explicit opt-out
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.labels.some((label) => label.name === "no-changelog")) {
              core.info("Label no-changelog is set; skipping changelog check.");
              return;
            }
            // listFiles caps at 3000 files; beyond that the check cannot see every change.
            if (pr.changed_files > 3000) {
              core.setFailed("PR changes more than 3000 files; split it or apply the no-changelog label.");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.some((f) => f.filename.startsWith("crates/") || f.filename.startsWith("prime-agent-runtime/"));
            const fragment = files.some((f) => f.status === "added" && f.additions > 0 && /^\.changes\/[^/]+\.md$/.test(f.filename));
            if (changed && !fragment) {
              core.setFailed("Add .changes/<slug>.md for native/runtime changes, or apply no-changelog.");
            }
