name: Nightly Process Stress

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-process-stress
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-stress:
    name: Process stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run native daemon and session process regressions
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          PRIME_AGENT_CODING_AGENT_DIR: ${{ runner.temp }}/optimus-nightly-profile
        run: cargo +1.95.0 test --locked -p pi-coding-agent --test native_cli -- --test-threads=1
