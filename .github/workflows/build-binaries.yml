name: Native release bundles

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --locked --release -p pi-coding-agent --bin optimus-rust
      - name: Stage executable and matching runtime resources
        shell: bash
        run: |
          binary=target/release/optimus-rust
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          target=$(rustc +1.95.0 -vV | sed -n 's/^host: //p')
          python3 scripts/rust_release.py stage --binary "$binary" --output dist --name "optimus-agent-$target"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optimus-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: optimus-*
          merge-multiple: true
          path: dist
      - name: Publish native bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --verify-tag --generate-notes
