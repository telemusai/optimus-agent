name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trust:
    name: Contributor trust
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ github.event_name == 'push' || steps.vouch.outputs.vouched == 'true' }}
    steps:
      - name: Check pull request author
        id: vouch
        if: github.event_name == 'pull_request'
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1
        with:
          user: ${{ github.event.pull_request.user.login }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-check:
    name: Rust check (${{ matrix.os }})
    needs: trust
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check all native targets
        run: cargo +1.95.0 check --locked --workspace --all-targets
      - name: Check resources and packaging
        shell: bash
        run: |
          python3 scripts/check-rust-layout.py
          python3 -m unittest discover -s tests -p 'test_*.py'

  test:
    name: Rust and Python tests
    needs: trust
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PRIME_AGENT_CODING_AGENT_DIR: ${{ runner.temp }}/optimus-ci-profile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: python3 -m pip install uv
      - name: Shared crate unit tests
        run: cargo +1.95.0 test --locked -p pi-ai -p pi-agent-core -p pi-tui -p pi-jev --lib -- --test-threads=1
      - name: Native configuration regressions
        run: cargo +1.95.0 test --locked -p pi-coding-agent --lib config::tests:: -- --test-threads=1
      - name: Native resource and command regressions
        run: cargo +1.95.0 test --locked -p pi-coding-agent --test rust_only_resources --test slash_command_matrix --test native_cli --test transcript_t06 -- --test-threads=1
      - name: Relocated Python skill regressions
        run: uv run --locked --project prime-agent-runtime python -m unittest discover -s prime-agent-runtime/test -p '*_skill.py'
      - name: Python observation aliases
        run: uv run --locked --project prime-agent-runtime python -m unittest discover -s prime-agent-runtime/test -p 'test_observation_aliases.py'

  build-check-test:
    name: build-check-test
    if: always() && needs.trust.outputs.allowed == 'true'
    needs: [trust, build-check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$BUILD_CHECK_RESULT" = success
          test "$TEST_RESULT" = success
