[project]
name = "prime-agent-runtime"
version = "0.1.42"
description = "Kernel-side runtime shim for Optimus Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "dill",
  "mcp>=2,<3",
  "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
